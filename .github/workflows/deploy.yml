name: Build Verification

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compile and Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        # Using install to bypass the esbuild platform-binary lockfile errors
        run: npm install

      - name: Run Build
        run: npm run build
        env:
          # Sets a dummy env for build scripts that require it
          CI: true
          NODE_ENV: production

      - name: Check Artifacts
        # Lists the build output to verify success
        run: ls -R dist || ls -R .next || ls -R build
          branch: gh-pages
          
